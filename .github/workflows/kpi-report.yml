name: KPI MTEL report

on:
  repository_dispatch:
    types: [kpi-report]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render & send to Telegram
        env:
          KPI_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          KPI_JSON_URL: ${{ secrets.KPI_JSON_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node render-kpi.js
